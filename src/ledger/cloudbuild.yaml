steps:
  - name: gcr.io/cloud-builders/gcloud
    id: download-skaffold-cache
    args: ['storage', 'cp', $_CACHE_URI, '/workspace/cache'] # always write skaffold cache to filename cache in workspace
  - name: gcr.io/k8s-skaffold/skaffold:v2.22.0
    id: install-jdk
    script: |
      set -eu
      curl -fsSL -o /workspace/jdk.tar.gz "https://github.com/adoptium/temurin${JDK_MAJOR}-binaries/releases/download/jdk-${JDK_VERSION}%2B${JDK_BUILD}/OpenJDK${JDK_MAJOR}U-jdk_x64_linux_hotspot_${JDK_VERSION}_${JDK_BUILD}.tar.gz"
      mkdir -p /workspace/jdk
      tar -xzf /workspace/jdk.tar.gz -C /workspace/jdk --strip-components=1
      rm /workspace/jdk.tar.gz
      /workspace/jdk/bin/java -version
    env:
      - "JDK_MAJOR=25"
      - "JDK_VERSION=25.0.4.1"
      - "JDK_BUILD=1"
  - name: gcr.io/k8s-skaffold/skaffold:v2.22.0
    id: build-and-push-images
    env:
      - "JAVA_HOME=/workspace/jdk"
    args:
      - "skaffold"
      - "build"
      - "--file-output=/workspace/artifacts.json"
      - "--default-repo=$_CONTAINER_REGISTRY"
      - "--cache-file=/workspace/$_CACHE" # set _CACHE to anything other than "cache" e.g. "no-cache" to reset skaffold cache
      - "--module=$_SERVICE"
  - name: gcr.io/cloud-builders/gcloud
    id: upload-skaffold-cache
    args: ['storage', 'cp', '/workspace/$_CACHE',  $_CACHE_URI]
  - name: gcr.io/k8s-skaffold/skaffold:v2.22.0
    id: run-tests
    script: MAVEN_USER_HOME=$MAVEN_USER_HOME skaffold test --build-artifacts=/workspace/artifacts.json --module=$SERVICE --assume-yes
    env:
      - "TEAM=$_TEAM"
      - "SERVICE=$_SERVICE"
      - "MAVEN_USER_HOME=/workspace/.m2"
      - "JAVA_HOME=/workspace/jdk"
    timeout: 1200s
  - name: gcr.io/cloud-builders/gcloud
    id: trigger-release
    args: 
      - "deploy"
      - "releases"
      - "create"
      - "$_SERVICE-$SHORT_SHA"
      - "--delivery-pipeline=$_SERVICE"
      - "--build-artifacts=/workspace/artifacts.json"
      - "--skaffold-file=src/$_TEAM/$_SERVICE/skaffold.yaml"
      - "--region=$LOCATION"
      - "--gcs-source-staging-dir=$_SOURCE_STAGING_BUCKET/$SHORT_SHA"
options:
  logging: CLOUD_LOGGING_ONLY
  env:
  - "TEAM=$_TEAM"
  - "SERVICE=$_SERVICE"
